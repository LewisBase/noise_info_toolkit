[project]
name = "noise-info-toolkit"
version = "1.4.0"
description = "Field noise dosimetry toolkit: TDMS streaming DSP, events and Streamlit dashboard"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.3.3",
  "pyarrow>=15,<18",
  "fastapi==0.115.6",
  "starlette==0.41.3",
  "httpx>=0.27,<0.29",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "soundfile>=0.12,<1",
  "nptdms>=1.10,<2",
  "watchdog>=4,<8",
  "loguru>=0.7,<1",
  "streamlit==1.49.1",
  "plotly>=5.20,<7",
  "requests>=2.31,<3",
  "pytest>=8,<10",
]

[tool.uv]
package = false
