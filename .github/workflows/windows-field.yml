name: field-windows

on:
  push:
    branches: [feat/field-deployment-hardening]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install field dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-field.txt
          pip check
      - name: Import smoke
        run: |
          python -c "import numpy, scipy, soundfile, nptdms, watchdog, streamlit; print('imports ok')"
          python -c "from app.config import Settings; s=Settings(); print(s.retention_mode)"
      - name: Tests
        run: |
          python -m pytest -q tests
